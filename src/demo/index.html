<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>JGenesis SDK — demo</title>
  <link rel="stylesheet" href="./demo/demo.css" />
  <link rel="stylesheet" href="./theme.genesis.css" />
  <script type="importmap">
    {
      "imports": {
        "@wasm-gaming/jgenesis-wasm": "./jgenesis/jgenesis.sdk.js"
      }
    }
  </script>
</head>
<body>
  <header class="console-bar">
    <span class="wordmark">JGENESIS</span>
    <span class="badge">16-BIT</span>

    <span class="runtime-tag">runtime <b id="runtime">…</b></span>
  </header>

  <main></main>

  <script type="module" src="./demo.js"></script>
  <script type="module" src="./demo/demo.js"></script>
</body>
</html>
